<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3D1; --card:#FFFBEE; --ink:#1C1033; --muted:#6B5B7B; --line:#E4D2A0; --edge:#1C1033; --shadowc:#1C1033;
  --accent:#E0115F; --accent-ink:#FFFFFF; --accent-soft:#FFD9E6; --gold:#FFB703; --teal:#00A19C; --chili:#E63B1F; --leaf:#2E9B4E;
  --ok:#1B7F43; --warn:#9A5B00; --bad:#B3261E; --board:#1C1033; --board-ink:#FFF3D1;
  --display:"Rozha One","Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Mukta","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#170C2B; --card:#241442; --ink:#FFF3D1; --muted:#BDAAD6; --line:#3B2766; --edge:#7C62B8; --shadowc:#0A0316;
  --accent:#FF4F8B; --accent-ink:#170C2B; --accent-soft:#3F1B3A; --gold:#FFC93C; --teal:#2DD4CF; --chili:#FF7A5C; --leaf:#5BD283;
  --ok:#5BD283; --warn:#F0B24A; --bad:#FF8A80; --board:#2A1550; --board-ink:#FFF3D1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);padding-bottom:96px}
html[lang="ur"] body{font-family:"Noto Nastaliq Urdu","Mukta","Noto Naskh Arabic",Arial,sans-serif;line-height:2.1;font-size:16px}
h1,h2,.cat,.dlg-h h2{font-family:var(--display);font-weight:400}
html[lang="ur"] h1,html[lang="ur"] h2,html[lang="ur"] .cat{font-family:"Noto Nastaliq Urdu",var(--display);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--edge)}
.top .row{display:flex;align-items:center;gap:8px;padding:8px 0}
.brand{font-size:1.9rem;flex:1;line-height:1}
.btn{border:2px solid var(--edge);background:var(--card);border-radius:12px;padding:6px 12px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;transition:transform .08s,box-shadow .08s}
.hbtn,.btn.primary{box-shadow:3px 3px 0 var(--shadowc)}
.hbtn:active,.btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadowc)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:2px 10px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.pic:focus-visible,.pick:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.badge{background:var(--gold);color:#1C1033;border-radius:999px;font-size:.78rem;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-weight:800;border:2px solid var(--edge)}
.lbl{display:none}
@media(min-width:620px){.lbl{display:inline}}

/* signboard */
.board{position:relative;margin:18px 0 0;padding:34px 22px 26px;background:var(--board);color:var(--board-ink);border-radius:22px;border:3px solid var(--edge);box-shadow:6px 6px 0 var(--gold)}
.board::before{content:"";position:absolute;inset:14px;border:2px dashed var(--gold);border-radius:14px;pointer-events:none;opacity:.7}
.bulbs::before,.bulbs::after{content:"";position:absolute;left:18px;right:18px;height:8px;background:radial-gradient(circle,var(--gold) 3px,transparent 3.6px) 0 0/18px 8px repeat-x;animation:chase 1.1s steps(1) infinite}
.bulbs::before{top:2px}.bulbs::after{bottom:2px;animation-delay:.55s}
@keyframes chase{0%{background-position:0 0;opacity:1}50%{background-position:9px 0;opacity:.55}100%{background-position:0 0;opacity:1}}
.board-name{margin:6px 0 4px;font-size:clamp(2rem,8vw,3.4rem);line-height:1.1;color:var(--gold)}
.board-line{margin:0 0 16px;font-size:1.05rem;max-width:34em}
.board-row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.pick{display:flex;align-items:center;gap:12px;text-align:start;background:var(--gold);color:#1C1033;border:2px solid #1C1033;border-radius:16px;padding:8px 14px 8px 8px;box-shadow:4px 4px 0 #000;font-weight:700}
.pick .pe{width:52px;height:52px;border-radius:50%;background:#FFF3D1;display:grid;place-items:center;font-size:1.9rem;border:2px solid #1C1033}
.pick span:last-child{display:flex;flex-direction:column;line-height:1.3}
.pick:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.ticket{display:flex;flex-direction:column;justify-content:center;padding:6px 18px;border:2px dashed var(--board-ink);border-radius:14px;line-height:1.3}
.ticket b{font-size:1.2rem;letter-spacing:.04em;color:var(--gold)}
.marq{overflow:hidden;direction:ltr;margin:20px -16px 0;background:var(--gold);color:#1C1033;border-block:2px solid var(--edge);font-weight:800;padding:6px 0}
.marq-in{display:inline-flex;white-space:nowrap;animation:marq 32s linear infinite;will-change:transform}
.marq-in span{padding-inline-end:28px}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq-in,.bulbs::before,.bulbs::after{animation:none}.marq{overflow-x:auto}}
.closed{background:var(--bad);color:#fff;border-radius:12px;padding:10px 14px;margin:12px 0 0;font-weight:700}

/* tools */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
.tools input[type=search]{flex:1;min-width:180px}
input,select,textarea{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;scrollbar-width:thin}
.chip{border:2px solid var(--edge);background:var(--card);border-radius:999px;padding:4px 16px;white-space:nowrap;min-height:42px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:3px 3px 0 var(--shadowc)}

/* menu board */
.cat{font-size:1.7rem;margin:28px 0 4px;display:flex;align-items:center;gap:12px;line-height:1.3}
.cat::after{content:"";flex:1;height:10px;background:radial-gradient(circle,var(--accent) 3px,transparent 3.6px) 0 50%/14px 10px repeat-x}
.rows{display:grid;grid-template-columns:1fr;column-gap:36px}
@media(min-width:780px){.rows{grid-template-columns:1fr 1fr}}
.item{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 0;border-bottom:2px dotted var(--edge)}
.item.off{opacity:.55}
.pic{width:84px;height:84px;border-radius:50%;border:2px solid var(--edge);box-shadow:4px 4px 0 var(--shadowc);font-size:2.6rem;line-height:1;background:var(--tone,#FFD166);display:grid;place-items:center;padding:0;align-self:start}
.pic:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadowc)}
.tone0{--tone:#FFD166}.tone1{--tone:#7FD6C8}.tone2{--tone:#FF9EBB}.tone3{--tone:#C9B6FF}.tone4{--tone:#FFB08A}
.nl{display:flex;align-items:baseline;gap:6px}
.nl h3{margin:0;font-size:1.08rem;font-weight:800;line-height:1.25}
html[lang="ur"] .nl h3{line-height:1.8}
.dots{flex:1;border-bottom:2px dotted var(--edge);min-width:12px;transform:translateY(-5px)}
.price{font-weight:800;white-space:nowrap}
.desc{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.acts{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:700;border-radius:8px;padding:0 8px;border:1.5px solid var(--edge);background:var(--card)}
.tag.hot{background:var(--chili);color:#fff;border-color:var(--chili)}
.tag.veg{background:var(--leaf);color:#fff;border-color:var(--leaf)}
:root[data-theme="dark"] .tag.hot,:root[data-theme="dark"] .tag.veg{color:#170C2B}
.fav{border:2px solid var(--edge);background:var(--card);border-radius:999px;width:38px;height:38px;font-size:1.05rem}
.fav[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.acts .right{display:flex;gap:8px;align-items:center}

/* cart bar */
.cartbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--edge);box-shadow:4px 4px 0 var(--shadowc);border-radius:16px;padding:12px 18px;font-weight:800;max-width:560px;margin:0 auto;min-height:56px}
.cartbar[hidden]{display:none}
.cartbar:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadowc)}

/* dialogs */
dialog{border:3px solid var(--edge);border-radius:20px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--bg);color:var(--ink);box-shadow:6px 6px 0 var(--shadowc);max-height:92vh}
dialog.wide{max-width:min(860px,96vw)}
dialog::backdrop{background:rgba(20,8,40,.62)}
.dlg-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:2px solid var(--edge);position:sticky;top:0;background:var(--gold);color:#1C1033;z-index:2}
.dlg-h h2{margin:0;font-size:1.3rem;flex:1;line-height:1.3}
.dlg-h .btn{background:#FFF3D1;color:#1C1033;border-color:#1C1033}
.dlg-b{padding:14px 16px 18px;overflow:auto;max-height:calc(92vh - 70px)}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dotted var(--edge)}
.line .ic{font-size:1.8rem}
.pimg{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.line .ic .pimg{width:44px;height:44px}
.pic,.pick .pe{overflow:hidden}
.line .grow{flex:1;min-width:0}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:38px;height:38px;border-radius:10px;border:2px solid var(--edge);background:var(--card);font-size:1.1rem;font-weight:800}
.sum{display:flex;justify-content:space-between;padding:3px 0}
.sum.total{font-weight:800;font-size:1.2rem;border-top:2px solid var(--edge);margin-top:6px;padding-top:8px}
.sum span:last-child{unicode-bidi:isolate;direction:ltr;white-space:nowrap}
.field{margin:10px 0}
.field label{display:block;font-weight:700;margin-bottom:4px}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{border:2px solid var(--edge);background:var(--card);padding:6px 12px;border-radius:12px;font-weight:600;margin:0;display:flex;gap:6px;align-items:center;min-height:44px}
.radio input{width:auto;min-height:0}
.radio label.on{background:var(--accent-soft);box-shadow:2px 2px 0 var(--shadowc)}
.note{color:var(--muted);font-size:.88rem}
.err{color:var(--bad);font-weight:700;margin:6px 0}
.ok{color:var(--ok)}
.steps{display:flex;gap:4px;margin:8px 0}
.steps span{flex:1;text-align:center;font-size:.76rem;padding:6px 2px;border-radius:8px;background:var(--line);color:var(--muted);font-weight:700}
.steps span.done{background:var(--teal);color:#06292A}
.steps span.now{background:var(--accent);color:var(--accent-ink)}
.order{border:2px solid var(--edge);background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.order h4{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.tabs button{border:2px solid var(--edge);background:var(--card);border-radius:10px;padding:6px 12px;white-space:nowrap;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.toast{position:fixed;top:auto;right:auto;margin:0;border:0;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:100;max-width:90vw;font-weight:700}
.toast[hidden]{display:none}
footer{border-top:2px solid var(--edge);padding:18px 0 40px;color:var(--muted);font-size:.9rem;margin-top:30px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
@media (max-width:560px){.two{grid-template-columns:1fr}}
@media print{header,footer,.tools,.chips,#grid,.board,.marq,.cartbar{display:none}}

/* ===== redesign ===== */
.top .row{padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font-size:1rem}
.logo{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1C1033;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;flex:none}
.bt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.bt b{font-family:var(--display);font-weight:400;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{color:var(--muted);font-size:.78rem}
.board{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 0;padding:14px 16px;border-radius:18px;box-shadow:4px 4px 0 var(--gold);min-height:0}
.board::before{display:none}
.hl{display:flex;flex-direction:column;gap:6px;min-width:0}
.hl small{color:var(--gold);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem}
.pick{box-shadow:none;padding:4px 12px 4px 4px;border-radius:999px;gap:8px}
.pick .pe{width:40px;height:40px;font-size:1.4rem}
.pick .pt{display:flex;flex-direction:column;line-height:1.25;font-size:.9rem;text-align:start}
.marq{display:none}
.tools{flex-wrap:nowrap;margin:14px 0 4px}
.sbox{position:relative;flex:1;min-width:0}
.sbox input{padding-inline-start:38px}
.sico{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:.95rem}
#sort{width:auto;max-width:112px;flex:none;padding-inline:8px;font-size:.85rem}
.chips{position:sticky;top:calc(var(--hh,60px) - 2px);z-index:15;background:var(--bg);margin:0 -16px;padding:8px 16px 10px;border-bottom:2px solid var(--edge)}
.cat{font-size:1.35rem;margin:20px 0 10px}
.cat::after{height:2px;background:var(--edge);opacity:.4}
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.rows{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.rows{grid-template-columns:repeat(4,1fr)}}
.item{display:flex;flex-direction:column;padding:0;border:2px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:3px 3px 0 var(--shadowc);overflow:hidden}
.pw{position:relative}
.pic{width:100%;height:140px;border:0;border-bottom:2px solid var(--edge);border-radius:0;box-shadow:none;font-size:3.4rem;align-self:auto}
.pic .pimg{border-radius:0}
.pw .fav{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px}
.tone5{--tone:#E4D2F5}
.ib{display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px;flex:1}
.ib h3{margin:0;font-size:1rem;font-weight:800;line-height:1.25}
.ib .desc{margin:0;font-size:.82rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.add{width:44px;height:44px;border-radius:50%;border:2px solid var(--edge);background:var(--accent);color:var(--accent-ink);font-size:1.6rem;font-weight:800;line-height:1;box-shadow:2px 2px 0 var(--shadowc)}
.add:active{transform:translate(1px,1px)}
.cartbar{left:0;right:0;bottom:0;max-width:none;border-radius:0;border-width:2px 0 0;box-shadow:none;background:#1F1A38;color:#fff;min-height:64px;padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.cartbar span:nth-child(1){font-weight:700}
.cartbar span:nth-child(2){margin-inline-start:auto;margin-inline-end:10px}
.cartbar span:nth-child(3){background:var(--gold);color:#1C1033;border-radius:12px;padding:10px 16px}
.toast{bottom:84px}
body{padding-bottom:84px}
.top .row{gap:6px;flex-wrap:nowrap}
.brand{flex:1;min-width:0}
.top .btn{min-height:40px;padding:4px 9px;border-radius:10px;box-shadow:2px 2px 0 var(--shadowc);flex:none}
.bt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ownerLink{color:var(--muted);font-size:.8rem;opacity:.8}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="row">
  <div class="brand" id="brand"></div>
  <button class="btn hbtn" id="btnLang"></button>
  <button class="btn hbtn" id="btnTheme"></button>
  <button class="btn hbtn" id="btnOrders"></button>
  <button class="btn primary" id="btnCart"></button>
</div></div></header>
<main class="wrap" id="main">
  <div id="closedBar"></div>
  <section class="board" id="hero"></section>
  <div class="marq" id="marq" aria-hidden="true"></div>
  <div class="tools">
    <div class="sbox"><span class="sico" aria-hidden="true">🔍</span><input type="search" id="q" autocomplete="off"></div>
    <select id="sort" aria-label="Sort"></select>
  </div>
  <div class="chips" id="chips" role="group"></div>
  <div id="grid" aria-live="polite"></div>
</main>
<footer><div class="wrap"><span id="foot"></span> · <a href="#" id="ownerLink"></a></div></footer>
<button class="cartbar" id="cartBar" hidden></button>
<div id="toast" class="toast" popover="manual" hidden role="status"></div>

<script>

/* ============ translations ============ */
const T = {

    s_received:"Received", s_preparing:"Preparing", s_ready:"Ready", s_delivered:"Done", s_cancelled:"Cancelled", ready_delivery:"On the way", ready_pickup:"Ready",

    today:"Today", revenue:"Revenue", ordersN:"Orders", itemName:"Name (English)", itemNameUr:"Name (Urdu, optional)", category:"Category", price:"Price (Rs)", emoji:"Emoji", desc:"Description",

const asArr = v => Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === "object" ? Object.values(v) : []);
function tfetch(url, opt = {}) {
  const c = new AbortController(), id = setTimeout(() => c.abort(), opt.timeout || 8000);
  const o = Object.assign({}, opt, { signal: c.signal }); delete o.timeout;
  return fetch(url, o).finally(() => clearTimeout(id));
}

/* ---- item photos: owner picks a photo, it is shrunk on the phone and kept in the database under photos/<itemId>.
   Menu items only carry a small version tag (m.img). Customers download each photo once and keep it on their phone. ---- */
const PHOTOKEY = "foodshop_photos_v1";
const photos = (() => { try { return JSON.parse(localStorage.getItem(PHOTOKEY)) || {}; } catch { return {}; } })();
const pkey = m => m.id + "|" + m.img;
const photoOf = m => (m && m.img && photos[pkey(m)]) || "";
const thumb = m => { const p = photoOf(m); return p ? `<img class="pimg" src="${esc(p)}" alt="" loading="lazy">` : esc((m && m.emoji) || "🍽️"); };
function savePhotos() { try { localStorage.setItem(PHOTOKEY, JSON.stringify(photos)); } catch {} }
const photoQ = [], photoPending = new Set(); let photoRun = 0, photoRenderT;
function ensurePhotos() {
  const keep = new Set(S.menu.filter(m => m.img).map(pkey)); let pruned = false;
  Object.keys(photos).forEach(k => { if (!keep.has(k)) { delete photos[k]; pruned = true; } });
  if (pruned) savePhotos();
  if (!cloudOn) return;
  S.menu.filter(m => m.img && !photos[pkey(m)] && !photoPending.has(pkey(m))).forEach(m => { photoPending.add(pkey(m)); photoQ.push(m); });
  pumpPhotos();
}
function pumpPhotos() {
  while (photoRun < 4 && photoQ.length) { const m = photoQ.shift(); photoRun++; fetchPhoto(m).finally(() => { photoRun--; photoPending.delete(pkey(m)); pumpPhotos(); }); }
}
async function fetchPhoto(m) {
  try {
    const r = await tfetch(dbUrl("photos/" + encodeURIComponent(m.id)), { timeout: 25000 });
    if (!r.ok) return;
    const d = await r.json();
    if (typeof d === "string" && d.startsWith("data:image/")) {
      photos[pkey(m)] = d; savePhotos();
      clearTimeout(photoRenderT); photoRenderT = setTimeout(() => { render(); ["dItem", "dCart", "dOwner"].forEach(refresh); }, 250);
    }
  } catch {}
}
/* shrink a picked photo to a small JPEG (about 20-40 KB) */
function resizeImage(file, max = 420) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.72, out = c.toDataURL("image/jpeg", q);
      while (out.length > 90000 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      out.length > 110000 ? rej(new Error("big")) : res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

  if (!cloudOn) return true;
  if (!cloud.token) return false;
  try {
    const tk = await cloudToken();
    const r = await tfetch(dbUrl("photos/" + encodeURIComponent(id)) + "?auth=" + encodeURIComponent(tk), { method: "PUT", body: JSON.stringify(data), timeout: 20000 });
    return r.ok;
  } catch { return false; }
}
function dropPhoto(id) {

}

async function cloudLoadOrders() {
  if (!cloudOn || !cloud.token) return;
  try {
    const tk = await cloudToken();
    const base = dbUrl("orders") + "?auth=" + encodeURIComponent(tk);
    let r = await tfetch(base + "&orderBy=%22time%22&limitToLast=150", { timeout: 15000 });
    if (!r.ok) r = await tfetch(base, { timeout: 15000 });
    if (!r.ok) return;
    const o = await r.json();
    const list = Object.values(o || {}).filter(x => x && x.id).map(normOrder).sort((a, b) => b.time - a.time);
    const fresh = cloud.seen ? list.filter(x => !cloud.seen.has(x.id)) : [];
    cloud.seen = new Set(list.map(x => x.id)); cloud.orders = list;
    if (fresh.length) { toast(t("newOrder") + ": " + fresh.map(x => x.id).join(", ")); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} }
    const d = document.getElementById("dOwner");
    if (ui.owner && d && d.open && ui.tab === "orders" && !ui.edit) refresh("dOwner");
  } catch {}
}
async function cloudOrderWrite(method, id, body) {
  try {
    const tk = await cloudToken();
    const r = await tfetch(dbUrl("orders/" + encodeURIComponent(id)) + "?auth=" + encodeURIComponent(tk), { method, body: body ? JSON.stringify(body) : undefined, timeout: 15000 });
    if (!r.ok) throw new Error("write");
  } catch { toast(t("cloudFail")); }
}

/* customers + owner: download the shared menu */
async function cloudPull() {
  if (!cloudOn) return;
  try {
    const r = await tfetch(dbUrl("shop") + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const o = await r.json();
    cloud.empty = !o || typeof o !== "object";
    if (cloud.empty) return;
    const sig = JSON.stringify(o);
    if (sig === cloud.last) return;
    cloud.last = sig;
    S.menu = asArr(o.menu).map(m => Object.assign({ avail: true }, m, { opts: asArr(m.opts) }));
    S.cats = asArr(o.cats);
    S.promos = asArr(o.promos);
    S.settings = Object.assign({}, D.settings, o.settings || {});
    S.cart = S.cart.filter(l => item(l.id));
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
    refreshAll(); ensurePhotos();
  } catch {}
}
/* owner only: log in with the Firebase email + password */
async function cloudSignIn(email, pass) {
  const r = await tfetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + encodeURIComponent(FIREBASE.apiKey),
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password: pass, returnSecureToken: true }) });
  const j = await r.json();
  if (!r.ok || !j.idToken) throw new Error("login");
  cloud.token = j.idToken; cloud.refresh = j.refreshToken; cloud.exp = Date.now() + (Number(j.expiresIn) - 60) * 1000;
}
async function cloudToken() {
  if (cloud.token && Date.now() < cloud.exp) return cloud.token;
  const r = await tfetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(FIREBASE.apiKey),
    { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(cloud.refresh) });
  const j = await r.json();
  if (!r.ok || !j.id_token) throw new Error("refresh");
  cloud.token = j.id_token; cloud.refresh = j.refresh_token; cloud.exp = Date.now() + (Number(j.expires_in) - 60) * 1000;
  return cloud.token;
}
/* owner only: upload the menu after every save */
let pushTimer;
function cloudPush() {
  if (!cloudOn || !cloud.token) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    const body = JSON.stringify(sharedData());
    if (body === cloud.sent) return;
    try {
      const tk = await cloudToken();
      const r = await tfetch(dbUrl("shop") + "?auth=" + encodeURIComponent(tk), { method: "PUT", body });
      if (r.ok) { cloud.sent = body; cloud.last = ""; toast(t("cloudSaved")); } else toast(t("cloudFail"));
    } catch { toast(t("cloudFail")); }
  }, 400);
}

/* ============ pricing ============ */
function linePrice(l) { const m = item(l.id); if (!m) return 0; const o = l.opt != null ? m.opts[l.opt] : null; return m.price + (o ? o.d : 0); }
function totals(orderType) {
  const sub = S.cart.reduce((a, l) => a + linePrice(l) * l.qty, 0);
  let disc = 0;
  const p = ui.promo && S.promos.find(x => x.code === ui.promo);
  if (p && sub >= p.min) disc = p.type === "percent" ? Math.round(sub * p.value / 100) : p.value;
  disc = Math.min(disc, sub);
  const after = sub - disc;
  const fee = (orderType === "delivery" && sub > 0) ? (after >= S.settings.freeOver && S.settings.freeOver > 0 ? 0 : S.settings.fee) : 0;
  return { sub, disc, fee, total: after + fee };
}

function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.hidden = false;
  /* popover puts the message in the top layer so it shows ABOVE open dialogs (owner panel) */
  try { if (el.matches(":popover-open")) el.hidePopover(); el.showPopover(); } catch {}
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.hidden = true; try { el.hidePopover(); } catch {} }, 2200);
}

function placeOrder() {
  const c = ui.ck, tt = totals(c.type), digits = c.phone.replace(/\D/g, "");
  c.err = "";
  if (!S.settings.open) c.err = t("closed");
  else if (!S.cart.length) c.err = t("cartEmpty");
  else if (c.name.trim().length < 2) c.err = t("needName");
  else if (digits.length < 10 || digits.length > 13) c.err = t("needPhone");
  else if (c.type === "delivery" && c.address.trim().length < 6) c.err = t("needAddr");
  else if (c.pay !== "cod" && c.txn.trim().length < 4) c.err = t("needTxn");
  if (c.err) { refresh("dCheckout"); return; }
  const o = {
    id: "FS-" + Date.now().toString(36).toUpperCase().slice(-6), time: Date.now(),
    items: S.cart.map(l => { const m = item(l.id); const op = l.opt != null ? m.opts[l.opt] : null; return { name: m.name, opt: op ? op.n : "", qty: l.qty, price: linePrice(l), note: l.note || "" }; }),
    name: c.name.trim(), phone: c.phone.trim(), address: c.type === "delivery" ? c.address.trim() : "", type: c.type, pay: c.pay, txn: c.txn.trim(), note: c.note.trim(),

  else if (el.dataset.act === "opaid") {
    const o = ownerList().find(x => x.id === el.dataset.id), lo = S.orders.find(x => x.id === el.dataset.id);
    if (o) o.paid = el.checked; if (lo) lo.paid = el.checked;
    if (cloudOn && o) cloudOrderWrite("PATCH", o.id, { paid: el.checked }); else save();
    refresh("dOwner");
  }
  else if (el.dataset.act === "avail") { const m = item(el.dataset.id); if (m) { m.avail = el.checked; save(); render(); } }
  else if (el.id === "photoIn" && el.files[0] && ui.edit) {
    resizeImage(el.files[0]).then(d => { ui.edit.imgData = d; ui.edit.removeImg = false; refresh("dOwner"); }).catch(() => toast(t("photoBad")));
  }
  else if (el.id === "impFile" && el.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!validBackup(o)) throw 0; S.cats = o.cats; S.menu = o.menu.map(m => Object.assign({ opts: [], avail: true }, m)); S.promos = Array.isArray(o.promos) ? o.promos : []; S.settings = Object.assign({}, demo().settings, o.settings); S.orders = o.orders; S.cart = []; save(); refreshAll(); toast(t("saved")); } catch { toast(t("badFile")); } };
    r.readAsText(el.files[0]);
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "q") { ui.q = el.value; render(); return; }
  if (el.dataset.ck) ui.ck[el.dataset.ck] = el.value;
  else if (el.dataset.ed) ui.edit[el.dataset.ed] = el.type === "checkbox" ? el.checked : el.value;
  else if (el.dataset.act === "inote") itemSel.note = el.value;
});
document.addEventListener("change", e => { const el = e.target; if (el.dataset.ed && el.type === "checkbox") ui.edit[el.dataset.ed] = el.checked; if (el.dataset.ed === "cat") ui.edit.cat = el.value; });
$("#sort").addEventListener("change", e => { ui.sort = e.target.value; render(); });
$("#btnLang").addEventListener("click", () => { S.lang = S.lang === "ur" ? "en" : "ur"; save(); refreshAll(); });
$("#btnTheme").addEventListener("click", () => { const cur = document.documentElement.dataset.theme; S.theme = cur === "dark" ? "light" : "dark"; save(); render(); });
$("#btnOrders").addEventListener("click", () => show("dOrders", renderOrders));
$("#btnCart").addEventListener("click", openCart);
$("#cartBar").addEventListener("click", openCart);
$("#ownerLink").addEventListener("click", e => { e.preventDefault(); openOwner(); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "pinIn" || e.target.id === "cPass")) { e.preventDefault(); const b = document.querySelector('[data-act="pinok"],[data-act="cloudlogin"]'); if (b) b.click(); } });

/* start: show the cached menu at once; first-time visitors wait for the online menu so they never see demo items */
(function start() {
  let cached = false; try { cached = !!localStorage.getItem(KEY); } catch {}
  if (!cloudOn) { render(); return; }
  if (cached) { render(); ensurePhotos(); cloudPull(); } else { cloudPull().finally(() => { render(); ensurePhotos(); }); }
  syncStatuses();
  setInterval(() => { if (!ui.owner && !document.hidden) { cloudPull(); syncStatuses(); } }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !ui.owner) { cloudPull(); syncStatuses(); } });
})();
</script>
</body>
